<!DOCTYPE html>
<html>
<head>
    <title>SilentGuard Team Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            max-width: 720px;
            margin: 40px auto;
            background: linear-gradient(135deg, #fdf2f8, #f0f9ff, #fef9ef);
            background-attachment: fixed;
            color: #4a4a68;
            padding: 0 20px 60px;
        }
        h1 { color: #8b5cf6; font-size: 2rem; margin-bottom: 4px; }
        h1::before { content: "🌸 "; }
        .subtitle { color: #a78bfa; font-size: 0.9rem; margin-bottom: 24px; }
        h2 { color: #a78bfa; font-size: 1.1rem; margin-top: 32px; display: flex; align-items: center; justify-content: space-between; }

        .panel {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 18px;
            padding: 18px 20px;
            box-shadow: 0 8px 24px rgba(192, 132, 252, 0.15);
        }

        form { display: flex; gap: 10px; margin-bottom: 8px; }
        input[type=text] {
            padding: 10px 14px;
            flex: 1;
            border: 2px solid #e9d5ff;
            border-radius: 12px;
            outline: none;
            background: rgba(255,255,255,0.8);
            transition: border-color 0.2s;
        }
        input[type=text]:focus { border-color: #c084fc; }
        button {
            padding: 10px 20px;
            background: #c084fc;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: #a855f7; transform: scale(1.03); }

        .stat-row { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
        .avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 0.9rem;
            flex-shrink: 0;
        }
        .stat-info { flex: 1; }
        .stat-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
        .bar-track { background: rgba(0,0,0,0.06); border-radius: 8px; height: 10px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 8px; width: 0%; transition: width 0.6s ease; }
        .stat-count { font-size: 0.85rem; font-weight: 700; color: #6b21a8; min-width: 20px; text-align: right; }

        .log-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.7);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 10px;
            opacity: 0;
            transform: translateY(8px);
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        .log-details { flex: 1; }
        .log-name { font-weight: 600; font-size: 0.9rem; }
        .log-task { color: #4a4a68; font-size: 0.9rem; }
        .log-time { color: #a78bfa; font-size: 0.75rem; margin-top: 2px; }
        a.delete-link { color: #f472b6; text-decoration: none; font-weight: 600; font-size: 0.8rem; white-space: nowrap; }
        a.delete-link:hover { text-decoration: underline; }

        .empty-state { text-align: center; padding: 30px 10px; color: #a78bfa; font-size: 0.95rem; }

        .export-link, .sort-link { font-size: 0.75rem; color: #a78bfa; text-decoration: none; font-weight: 600; }
        .export-link:hover, .sort-link:hover { text-decoration: underline; }

        /* --- Mascot row --- */
        .mascot-row { display: flex; justify-content: center; align-items: flex-end; gap: 28px; margin-bottom: 6px; }
        .mascot-item { text-align: center; position: relative; }
        .mascot-name { font-size: 0.72rem; font-weight: 700; color: #8b5cf6; margin-top: 2px; }
        .mascot-msg { font-size: 0.68rem; color: #a78bfa; height: 14px; margin-top: 2px; max-width: 100px; }
        .fx-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* Bessie */
        .idle { animation: bob 2.4s ease-in-out infinite; }
        .happy { animation: bounce-happy 0.6s ease; }
        @keyframes bob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(-2deg); }
        }
        @keyframes bounce-happy {
            0% { transform: scale(1) translateY(0); }
            30% { transform: scale(1.15, 0.85) translateY(4px); }
            55% { transform: scale(0.95, 1.1) translateY(-14px); }
            75% { transform: scale(1.05, 0.95) translateY(2px); }
            100% { transform: scale(1) translateY(0); }
        }
        .blink #bessie-eye-l, .blink #bessie-eye-r { transform: scaleY(0.1); }
        #bessie-eye-l, #bessie-eye-r { transition: transform 0.1s ease; transform-origin: center; }
        .sleepy { animation: sleepy-tilt 2.5s ease-in-out infinite !important; }
        @keyframes sleepy-tilt {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            50% { transform: rotate(-6deg) translateY(2px); }
        }
        .sparkle { position: absolute; font-size: 14px; opacity: 0; animation: sparkle-float 1s ease-out forwards; }
        @keyframes sparkle-float {
            0% { opacity: 1; transform: translateY(0) scale(0.6); }
            100% { opacity: 0; transform: translateY(-30px) scale(1.2); }
        }

        /* Paddie */
        .idle-paddie { animation: sway 3.1s ease-in-out infinite; transform-origin: bottom center; }
        .happy-paddie { animation: pounce 0.7s ease; }
        @keyframes sway {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-4deg); }
            75% { transform: rotate(4deg); }
        }
        @keyframes pounce {
            0% { transform: scale(1) translate(0,0) rotate(0deg); }
            20% { transform: scale(0.85, 1.15) translateY(6px) rotate(-6deg); }
            45% { transform: scale(1.2, 0.8) translate(10px,-16px) rotate(10deg); }
            70% { transform: scale(0.9, 1.1) translate(-4px,2px) rotate(-4deg); }
            100% { transform: scale(1) translate(0,0) rotate(0deg); }
        }
        #paddie-tail { animation: tail-flick 1.6s ease-in-out infinite; transform-origin: 78px 70px; }
        @keyframes tail-flick {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(18deg); }
        }
        .ear-twitch { animation: ear-twitch-anim 0.4s ease; }
        @keyframes ear-twitch-anim {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-12deg); }
        }

        /* Drummie */
        .idle-drummie { animation: flutter 1.1s ease-in-out infinite, bounce-walk 0.9s ease-in-out infinite; }
        .happy-drummie { animation: spinhop 0.7s ease; }
        @keyframes flutter {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }
        @keyframes bounce-walk {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(3px); }
        }
        @keyframes spinhop {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            35% { transform: translateY(-22px) rotate(180deg) scale(1.1); }
            70% { transform: translateY(0) rotate(340deg) scale(0.95); }
            100% { transform: translateY(0) rotate(360deg) scale(1); }
        }
        #drummie-wing-l { animation: flap-l 0.35s ease-in-out infinite; transform-origin: 24px 58px; }
        #drummie-wing-r { animation: flap-r 0.35s ease-in-out infinite; transform-origin: 76px 58px; }
        @keyframes flap-l {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-25deg); }
        }
        @keyframes flap-r {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(25deg); }
        }
        .big-flap { animation: big-flap-anim 0.5s ease !important; }
        @keyframes big-flap-anim {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-14px) scale(1.15); }
        }
        .confetti-bit { position: absolute; width: 6px; height: 6px; opacity: 1; animation: confetti-burst 0.8s ease-out forwards; }
        @keyframes confetti-burst {
            0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; }
        }

        /* Shared sad wobble */
        .sad-wobble { animation: sad-anim 0.6s ease !important; }
        @keyframes sad-anim {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(4px) rotate(-3deg); }
        }
    </style>
</head>
<body>
    <h1>Team Activity Log</h1>

    <div class="mascot-row">
        <!-- Bessie -->
        <div class="mascot-item">
            <div class="fx-layer" id="fx-bessie"></div>
            <svg id="mascot-bessie" class="idle" width="80" height="80" viewBox="0 0 100 100">
                <ellipse cx="50" cy="58" rx="34" ry="30" fill="#c084fc"/>
                <ellipse cx="28" cy="30" rx="10" ry="12" fill="#c084fc"/>
                <ellipse cx="72" cy="30" rx="10" ry="12" fill="#c084fc"/>
                <ellipse cx="28" cy="30" rx="5" ry="6" fill="#f472b6"/>
                <ellipse cx="72" cy="30" rx="5" ry="6" fill="#f472b6"/>
                <circle id="bessie-eye-l" cx="38" cy="55" r="4" fill="#4a4a68"/>
                <circle id="bessie-eye-r" cx="62" cy="55" r="4" fill="#4a4a68"/>
                <ellipse cx="30" cy="65" rx="5" ry="3" fill="#f9a8d4" opacity="0.7"/>
                <ellipse cx="70" cy="65" rx="5" ry="3" fill="#f9a8d4" opacity="0.7"/>
                <path id="bessie-mouth" d="M 42 68 Q 50 72 58 68" stroke="#4a4a68" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            </svg>
            <div class="mascot-name">Bessie</div>
            <div id="msg-bessie" class="mascot-msg"></div>
        </div>

        <!-- Paddie -->
        <div class="mascot-item">
            <svg id="mascot-paddie" class="idle-paddie" width="80" height="80" viewBox="0 0 100 100">
                <path id="paddie-tail" d="M 78 70 Q 95 65 92 45" stroke="#fb923c" stroke-width="8" fill="none" stroke-linecap="round"/>
                <ellipse cx="50" cy="60" rx="32" ry="28" fill="#fb923c"/>
                <path d="M 24 32 L 14 10 L 36 26 Z" fill="#fb923c"/>
                <path d="M 76 32 L 86 10 L 64 26 Z" fill="#fb923c"/>
                <path d="M 24 30 L 20 16 L 32 26 Z" fill="#fed7aa"/>
                <path d="M 76 30 L 80 16 L 68 26 Z" fill="#fed7aa"/>
                <path id="paddie-eye-l" d="M 33 56 Q 38 52 43 56" stroke="#7c2d12" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path id="paddie-eye-r" d="M 57 56 Q 62 52 67 56" stroke="#7c2d12" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M 8 58 L 26 60 M 8 65 L 26 63" stroke="#fed7aa" stroke-width="1.5" opacity="0.8"/>
                <path d="M 92 58 L 74 60 M 92 65 L 74 63" stroke="#fed7aa" stroke-width="1.5" opacity="0.8"/>
                <path id="paddie-mouth" d="M 44 68 Q 50 71 50 68 Q 50 71 56 68" stroke="#7c2d12" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            </svg>
            <div class="mascot-name">Paddie</div>
            <div id="msg-paddie" class="mascot-msg"></div>
        </div>

        <!-- Drummie -->
        <div class="mascot-item">
            <div class="fx-layer" id="fx-drummie"></div>
            <svg id="mascot-drummie" class="idle-drummie" width="80" height="80" viewBox="0 0 100 100">
                <ellipse id="drummie-wing-l" cx="24" cy="58" rx="12" ry="18" fill="#60a5fa"/>
                <ellipse id="drummie-wing-r" cx="76" cy="58" rx="12" ry="18" fill="#60a5fa"/>
                <ellipse cx="50" cy="55" rx="28" ry="26" fill="#93c5fd"/>
                <path d="M 50 20 L 44 8 L 56 8 Z" fill="#93c5fd"/>
                <path d="M 44 52 L 30 48 L 44 58 Z" fill="#fbbf24"/>
                <circle id="drummie-eye-l" cx="43" cy="50" r="4" fill="#1e3a8a"/>
                <circle id="drummie-eye-r" cx="59" cy="46" r="4" fill="#1e3a8a"/>
                <path id="drummie-mouth" d="M 46 62 Q 52 66 58 61" stroke="#1e3a8a" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
            <div class="mascot-name">Drummie</div>
            <div id="msg-drummie" class="mascot-msg"></div>
        </div>
    </div>

    <div class="subtitle" style="text-align:center;">SilentGuard — keeping everyone's contributions visible</div>

    <div class="panel">
        <form id="log-form">
            <input type="text" id="name" placeholder="Your name" required>
            <input type="text" id="task" placeholder="What did you do?" required>
            <button type="submit">Log it</button>
        </form>
        <div style="margin-top:10px;">
            <a href="#" id="sort-toggle" class="sort-link">↕ Newest first</a>
        </div>
    </div>

    <h2>Contribution Summary</h2>
    <div class="panel" id="stats-panel"></div>

    <h2>Full Log <a href="/export" class="export-link">⬇ Export CSV</a></h2>
    <div id="logs-panel"></div>

    <script>
        const palette = ["#c084fc", "#f472b6", "#60a5fa", "#34d399", "#fbbf24", "#fb923c", "#a78bfa", "#f87171"];

        function colorFor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return palette[Math.abs(hash) % palette.length];
        }

        // --- Mascot trio ---
        const bessie = document.getElementById("mascot-bessie");
        const paddie = document.getElementById("mascot-paddie");
        const drummie = document.getElementById("mascot-drummie");
        const msgBessie = document.getElementById("msg-bessie");
        const msgPaddie = document.getElementById("msg-paddie");
        const msgDrummie = document.getElementById("msg-drummie");

        const bessieCheers = ["Yay, task logged! 🌸", "Nice work! ✨", "Go team! 💜"];
        const paddieCheers = ["heh, got it~ 😼", "sneaky good work", "*knocks task off table* done", "purrfect 🐾"];
        const drummieCheers = ["WOO LOGGED IT 🎉", "let's gooo!!", "chirp chirp, nice!!", "on fire today! 🔥"];
        const paddieDeleteLines = ["I didn't do it 😼", "*innocent stare*", "poof, gone~"];

        function spawnSparkles(containerId) {
            const container = document.getElementById(containerId);
            for (let i = 0; i < 4; i++) {
                const s = document.createElement("div");
                s.className = "sparkle";
                s.textContent = "✨";
                s.style.left = `${20 + Math.random() * 50}%`;
                s.style.top = `${20 + Math.random() * 40}%`;
                s.style.animationDelay = `${i * 0.1}s`;
                container.appendChild(s);
                setTimeout(() => s.remove(), 1000);
            }
        }

        const confettiColors = ["#60a5fa", "#fbbf24", "#f472b6", "#34d399", "#c084fc"];
        function spawnConfetti(containerId) {
            const container = document.getElementById(containerId);
            for (let i = 0; i < 10; i++) {
                const c = document.createElement("div");
                c.className = "confetti-bit";
                c.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                c.style.left = "50%";
                c.style.top = "40%";
                const angle = Math.random() * Math.PI * 2;
                const dist = 30 + Math.random() * 25;
                c.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
                c.style.setProperty("--dy", `${Math.sin(angle) * dist}px`);
                container.appendChild(c);
                setTimeout(() => c.remove(), 800);
            }
        }

        let idleTimer;
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            bessie.classList.remove("sleepy");
            idleTimer = setTimeout(() => bessie.classList.add("sleepy"), 30000);
        }
        resetIdleTimer();

        // Bessie idle blink
        setInterval(() => {
            bessie.classList.add("blink");
            setTimeout(() => bessie.classList.remove("blink"), 150);
        }, 3500 + Math.random() * 2000);

        // Paddie random ear twitch
        setInterval(() => {
            paddie.classList.add("ear-twitch");
            setTimeout(() => paddie.classList.remove("ear-twitch"), 400);
        }, 4000 + Math.random() * 3000);

        // Drummie occasional big flap
        setInterval(() => {
            drummie.classList.add("big-flap");
            setTimeout(() => drummie.classList.remove("big-flap"), 500);
        }, 5000 + Math.random() * 4000);

        function reactMascot() {
            resetIdleTimer();
            spawnSparkles("fx-bessie");
            spawnConfetti("fx-drummie");

            bessie.classList.remove("idle");
            bessie.classList.add("happy");
            document.getElementById("bessie-eye-l").setAttribute("cy", "53");
            document.getElementById("bessie-eye-r").setAttribute("cy", "53");
            document.getElementById("bessie-mouth").setAttribute("d", "M 40 66 Q 50 76 60 66");
            msgBessie.textContent = bessieCheers[Math.floor(Math.random() * bessieCheers.length)];

            paddie.classList.remove("idle-paddie");
            paddie.classList.add("happy-paddie");
            msgPaddie.textContent = paddieCheers[Math.floor(Math.random() * paddieCheers.length)];

            drummie.classList.remove("idle-drummie");
            drummie.classList.add("happy-drummie");
            msgDrummie.textContent = drummieCheers[Math.floor(Math.random() * drummieCheers.length)];

            setTimeout(() => {
                bessie.classList.remove("happy");
                bessie.classList.add("idle");
                document.getElementById("bessie-eye-l").setAttribute("cy", "55");
                document.getElementById("bessie-eye-r").setAttribute("cy", "55");
                document.getElementById("bessie-mouth").setAttribute("d", "M 42 68 Q 50 72 58 68");
                msgBessie.textContent = "";

                paddie.classList.remove("happy-paddie");
                paddie.classList.add("idle-paddie");
                msgPaddie.textContent = "";

                drummie.classList.remove("happy-drummie");
                drummie.classList.add("idle-drummie");
                msgDrummie.textContent = "";
            }, 1300);
        }

        function paddieDeleteReact() {
            paddie.classList.remove("idle-paddie");
            paddie.classList.add("happy-paddie");
            msgPaddie.textContent = paddieDeleteLines[Math.floor(Math.random() * paddieDeleteLines.length)];
            setTimeout(() => {
                paddie.classList.remove("happy-paddie");
                paddie.classList.add("idle-paddie");
                msgPaddie.textContent = "";
            }, 1200);
        }

        function sadReact() {
            [bessie, paddie, drummie].forEach(m => {
                m.classList.add("sad-wobble");
                setTimeout(() => m.classList.remove("sad-wobble"), 600);
            });
        }
        // --- end mascot trio ---

        // --- Sound effects ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playChime(freqs, durations) {
            let time = audioCtx.currentTime;
            freqs.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(freq, time);
                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(0.15, time + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, time + durations[i]);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(time);
                osc.stop(time + durations[i]);
                time += durations[i] * 0.6;
            });
        }

        function playLogSound() { playChime([660, 880, 1046], [0.12, 0.12, 0.25]); }
        function playDeleteSound() { playChime([440, 300], [0.15, 0.2]); }
        function playPaddieSound() { playChime([520, 700, 480], [0.08, 0.08, 0.14]); }
        function playDrummieSound() { playChime([900, 1100, 950, 1200], [0.06, 0.06, 0.06, 0.12]); }
        // --- end sound effects ---

        // --- Sort toggle ---
        let sortNewestFirst = true;
        document.getElementById("sort-toggle").addEventListener("click", (e) => {
            e.preventDefault();
            sortNewestFirst = !sortNewestFirst;
            e.target.textContent = sortNewestFirst ? "↕ Newest first" : "↕ Oldest first";
            loadData();
        });
        // --- end sort toggle ---

        async function loadData() {
            const res = await fetch("/data");
            const data = await res.json();

            const statsPanel = document.getElementById("stats-panel");
            if (data.stats.length === 0) {
                statsPanel.innerHTML = `<div class="empty-state">No tasks yet — be the first to log something! 🌷</div>`;
            } else {
                const maxCount = Math.max(...data.stats.map(s => s.count));
                statsPanel.innerHTML = data.stats.map(s => {
                    const color = colorFor(s.name);
                    const pct = Math.max(8, (s.count / maxCount) * 100);
                    return `
                        <div class="stat-row">
                            <div class="avatar" style="background:${color}">${s.name.charAt(0).toUpperCase()}</div>
                            <div class="stat-info">
                                <div class="stat-name">${s.name}</div>
                                <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${color}"></div></div>
                            </div>
                            <div class="stat-count">${s.count}</div>
                        </div>`;
                }).join("");
            }

            const logsPanel = document.getElementById("logs-panel");
            const sortedLogs = sortNewestFirst ? data.logs : [...data.logs].reverse();
            if (sortedLogs.length === 0) {
                logsPanel.innerHTML = `<div class="panel empty-state">Nothing logged yet 🎀</div>`;
            } else {
                logsPanel.innerHTML = sortedLogs.map(l => {
                    const color = colorFor(l.name);
                    return `
                        <div class="log-card">
                            <div class="avatar" style="background:${color}">${l.name.charAt(0).toUpperCase()}</div>
                            <div class="log-details">
                                <div class="log-name">${l.name}</div>
                                <div class="log-task">${l.task}</div>
                                <div class="log-time">${l.timestamp}</div>
                            </div>
                            <a class="delete-link" onclick="deleteLog(${l.id})">delete</a>
                        </div>`;
                }).join("");
            }
        }

        async function deleteLog(id) {
            playDeleteSound();
            sadReact();
            paddieDeleteReact();
            await fetch(`/delete/${id}`, { method: "POST" });
            loadData();
        }

        document.getElementById("log-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const task = document.getElementById("task").value;

            await fetch("/add", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `name=${encodeURIComponent(name)}&task=${encodeURIComponent(task)}`
            });

            document.getElementById("name").value = "";
            document.getElementById("task").value = "";
