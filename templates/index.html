<!DOCTYPE html>
<html>
<head>
    <title>SilentGuard Team Tracker</title>
   <style>
    body {
        font-family: 'Segoe UI', sans-serif;
        max-width: 700px;
        margin: 40px auto;
        background: linear-gradient(135deg, #fdf2f8, #f0f9ff);
        color: #4a4a68;
        padding: 0 20px;
    }
    h1 {
        color: #8b5cf6;
        font-size: 2rem;
    }
    h1::before { content: "🌸 "; }
    h2 { color: #a78bfa; }

    form {
        margin-bottom: 24px;
        display: flex;
        gap: 10px;
    }
    input[type=text] {
        padding: 10px 14px;
        flex: 1;
        border: 2px solid #e9d5ff;
        border-radius: 12px;
        outline: none;
        transition: border-color 0.2s;
    }
    input[type=text]:focus { border-color: #c084fc; }

    button {
        padding: 10px 20px;
        background: #c084fc;
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #a855f7; transform: scale(1.03); }

    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        background: white;
        margin-bottom: 24px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 4px 12px rgba(192, 132, 252, 0.15);
    }
    th, td { padding: 12px 14px; text-align: left; }
    th {
        background: #e9d5ff;
        color: #6b21a8;
        font-weight: 600;
    }
    tr:nth-child(even) td { background: #fdf4ff; }
    tr:hover td { background: #f5e8ff; }

    a.delete-link {
        color: #f472b6;
        text-decoration: none;
        font-weight: 500;
    }
    a.delete-link:hover { text-decoration: underline; }
</style>
</head>
<body>
    <h1>Team Activity Log</h1>

    <form id="log-form">
        <input type="text" id="name" name="name" placeholder="Your name" required>
        <input type="text" id="task" name="task" placeholder="What did you do?" required>
        <button type="submit">Log it</button>
    </form>

    <h2>Contribution Summary</h2>
    <table>
        <tr><th>Name</th><th>Tasks Logged</th></tr>
        <tbody id="stats-body"></tbody>
    </table>

    <h2>Full Log</h2>
    <table>
        <tr><th>Name</th><th>Task</th><th>Time</th><th></th></tr>
        <tbody id="logs-body"></tbody>
    </table>

    <script>
        async function loadData() {
            const res = await fetch("/data");
            const data = await res.json();

            const statsBody = document.getElementById("stats-body");
            statsBody.innerHTML = "";
            data.stats.forEach(s => {
                statsBody.innerHTML += `<tr><td>${s.name}</td><td>${s.count}</td></tr>`;
            });

            const logsBody = document.getElementById("logs-body");
            logsBody.innerHTML = "";
            data.logs.forEach(l => {
                logsBody.innerHTML += `
                    <tr>
                        <td>${l.name}</td>
                        <td>${l.task}</td>
                        <td>${l.timestamp}</td>
                        <td><a class="delete-link" onclick="deleteLog(${l.id})">delete</a></td>
                    </tr>`;
            });
        }

        async function deleteLog(id) {
            await fetch(`/delete/${id}`, { method: "POST" });
            loadData();
        }

        document.getElementById("log-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const task = document.getElementById("task").value;

            await fetch("/add", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `name=${encodeURIComponent(name)}&task=${encodeURIComponent(task)}`
            });

            document.getElementById("name").value = "";
            document.getElementById("task").value = "";
            loadData();
        });

        loadData();
    </script>
</body>
</html>
